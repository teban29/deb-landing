# Production reverse proxy for D.E.B TOUT CORPS.
# Terminate TLS here with Certbot and enable the SSL blocks at the bottom.

limit_req_zone $binary_remote_addr zone=site_req:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=site_api:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=site_contact:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=cms_req:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=cms_login:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=perip:10m;

proxy_cache_path /var/cache/nginx/deb levels=1:2 keys_zone=deb_cache:20m max_size=512m inactive=30m use_temp_path=off;

upstream deb_web {
	server web:4321;
}

upstream deb_cms {
	server cms:1337;
}

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss image/svg+xml;

server {
	listen 80;
	server_name deb-tout.com www.deb-tout.com;

	server_tokens off;
	client_max_body_size 2M;
	limit_req_status 429;
	limit_conn_status 429;

	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
	add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; media-src 'self' https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
	add_header X-Cache-Status $upstream_cache_status always;
	proxy_hide_header X-Powered-By;

	location /.well-known/acme-challenge/ {
		root /var/www/certbot;
	}

	location = /api/contact {
		limit_req zone=site_contact burst=5 nodelay;
		limit_conn perip 10;
		proxy_cache off;
		proxy_pass http://deb_web;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location /api/ {
		limit_req zone=site_api burst=10 nodelay;
		limit_conn perip 20;
		proxy_cache off;
		proxy_pass http://deb_web;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
	}

	location / {
		limit_req zone=site_req burst=40 nodelay;
		limit_conn perip 30;

		proxy_cache deb_cache;
		proxy_cache_methods GET HEAD;
		proxy_cache_valid 200 60s;
		proxy_cache_valid 404 10s;
		proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
		proxy_cache_background_update on;
		proxy_cache_lock on;
		proxy_cache_bypass $cookie_astro_session;
		proxy_no_cache $cookie_astro_session;

		proxy_pass http://deb_web;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
	}

	location ~ /\.(?!well-known) {
		deny all;
	}
}

server {
	listen 80;
	server_name cms.deb-tout.com;

	server_tokens off;
	client_max_body_size 50M;
	limit_req_status 429;
	limit_conn_status 429;

	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
	proxy_hide_header X-Powered-By;

	location /.well-known/acme-challenge/ {
		root /var/www/certbot;
	}

	# Stricter limit for the admin login endpoint.
	location = /admin/login {
		limit_req zone=cms_login burst=3 nodelay;
		limit_conn perip 10;
		proxy_pass http://deb_cms;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location / {
		limit_req zone=cms_req burst=50 nodelay;
		limit_conn perip 20;
		proxy_read_timeout 120s;
		proxy_send_timeout 120s;
		proxy_pass http://deb_cms;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
	}

	# Optional extra protection: restrict the CMS to your IP / VPN / office.
	# Uncomment and adapt before enabling:
	# allow 203.0.113.10;
	# deny all;

	location ~ /\.(?!well-known) {
		deny all;
	}
}

