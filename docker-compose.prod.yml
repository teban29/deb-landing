name: deb-landing-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-deb_cms}
      POSTGRES_USER: ${POSTGRES_USER:-deb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-deb} -d ${POSTGRES_DB:-deb_cms}"]
      interval: 10s
      timeout: 5s
      retries: 20

  cms:
    image: deb-landing-cms:prod
    init: true
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    build:
      context: ./cms
      target: production
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 1337
      PUBLIC_CMS_URL: ${PUBLIC_CMS_URL:-https://cms.deb-tout.com}
      PROXY: "true"
      STRAPI_TELEMETRY_DISABLED: "true"
      UPLOAD_SIZE_LIMIT: ${UPLOAD_SIZE_LIMIT:-52428800}
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-deb_cms}
      DATABASE_USERNAME: ${POSTGRES_USER:-deb}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_SSL: "false"
      APP_KEYS: ${APP_KEYS}
      API_TOKEN_SALT: ${API_TOKEN_SALT}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      CORS_ORIGINS: ${PUBLIC_SITE_URL:-https://deb-tout.com}
      SEED_ON_BOOT: ${SEED_ON_BOOT:-false}
      AWS_ENDPOINT: ${AWS_ENDPOINT:-}
      AWS_REGION: ${AWS_REGION:-auto}
      AWS_BUCKET: ${AWS_BUCKET:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_ACCESS_SECRET: ${AWS_ACCESS_SECRET:-}
      AWS_PUBLIC_URL: ${AWS_PUBLIC_URL:-}
      AWS_FORCE_PATH_STYLE: ${AWS_FORCE_PATH_STYLE:-true}
      AWS_ROOT_PATH: ${AWS_ROOT_PATH:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - cms_uploads:/app/public/uploads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:1337/_health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

  web:
    image: deb-landing-web:prod
    init: true
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    build:
      context: .
      target: production
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4321
      CMS_URL: http://cms:1337
      CMS_PUBLIC_URL: ${CMS_PUBLIC_URL:-https://cms.deb-tout.com}
      CMS_API_TOKEN: ${CMS_API_TOKEN:-}
      CMS_CACHE_TTL_MS: ${CMS_CACHE_TTL_MS:-300000}
      CMS_WEBHOOK_SECRET: ${CMS_WEBHOOK_SECRET:-}
      RATE_LIMIT_CONTACT: ${RATE_LIMIT_CONTACT:-5}
      RATE_LIMIT_CONTACT_WINDOW_MS: ${RATE_LIMIT_CONTACT_WINDOW_MS:-600000}
      RATE_LIMIT_WEBHOOK: ${RATE_LIMIT_WEBHOOK:-60}
      RATE_LIMIT_WEBHOOK_WINDOW_MS: ${RATE_LIMIT_WEBHOOK_WINDOW_MS:-60000}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      CONTACT_TO_EMAIL: ${CONTACT_TO_EMAIL:-}
      CONTACT_FROM_EMAIL: ${CONTACT_FROM_EMAIL:-}
    depends_on:
      cms:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4321/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/certbot/conf:/etc/letsencrypt:ro
      - ./docker/certbot/www:/var/www/certbot:ro
    depends_on:
      web:
        condition: service_healthy
      cms:
        condition: service_healthy

volumes:
  postgres_data:
  cms_uploads:
